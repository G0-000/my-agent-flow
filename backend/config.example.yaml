# my-agent-flow 配置样例
# 用法：cp config.example.yaml config.yaml（config.yaml 已被 .gitignore 忽略）
# 字段名严格对齐 EvoFlow：models 里每条是 ModelConfig，name 是条目名，model 是模型 ID。

log_level: info

models:
  # name  —— 条目名，primary_model 指向它（唯一）
  # model —— 真正发给厂商的模型 ID
  # use   —— provider 类路径（openai 用 langchain_openai:ChatOpenAI；
  #          开发用 stub 见下方注释段：工厂内置 StubChatModel，use 可省略）
  - name: local
    vendor: openai
    use: langchain_openai:ChatOpenAI
    model: gpt-4o-mini
    base_url: http://127.0.0.1:1234/v1     # 本地 LM Studio / Ollama / 自建网关，按需改
    api_key: ""                            # 本地可留空；云端填 key（本复刻暂不做 $ENV 展开）
    temperature: 0.0
    request_timeout: 120
    max_retries: 1

primary_model: local

checkpointer:
  type: sqlite                             # memory | sqlite | postgres（postgres 需 MYAF_CHECKPOINT_PG_DSN）
  connection_string: data/checkpoints.db

storage:
  backend: sqlite
  sqlite_path: data/app/myagentflow.db

# —— 离线开发替身（stub）：不联网、不装第三方 SDK，仅供本地开发/演示与测试，切勿进生产 ——
# 想离线跑通 demo 与测试时：取消下面注释，并删掉上面的 models 列表（两者只能留一个），
# 让 primary_model 指向 stub：
#
# models:
#   - name: stub
#     vendor: stub
#     use: myagentflow.models.providers.stub:StubChatModel   # 可省略，工厂会内置
#     model: stub
#     temperature: 0.0
#
# primary_model: stub
#
# checkpointer:
#   type: memory

